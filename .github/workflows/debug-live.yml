name: Debug live page

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Retest gold-api.com reliability (5x)
        run: |
          for i in 1 2 3 4 5; do
            echo "=== attempt $i ==="
            curl -sS -m 8 -w "\nHTTP_CODE:%{http_code}\n" "https://api.gold-api.com/price/XAU" || echo "FAILED attempt $i"
            sleep 1
          done
      - name: DNS check
        run: |
          getent hosts api.gold-api.com || echo "DNS FAIL for gold-api.com"
          getent hosts api.coingecko.com || echo "DNS FAIL for coingecko"
      - name: Test CoinGecko PAXG as alternative
        run: |
          echo "=== coingecko simple price ==="
          curl -sS -D - "https://api.coingecko.com/api/v3/simple/price?ids=pax-gold&vs_currencies=usd" || true
          echo ""
          echo "=== coingecko CORS check ==="
          curl -sS -D - -o /dev/null -H "Origin: https://mohia0.github.io" "https://api.coingecko.com/api/v3/simple/price?ids=pax-gold&vs_currencies=usd" | grep -i "access-control" || echo "NO CORS HEADER FOUND"
