name: Debug live prices now

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: gold-api.com
        run: |
          curl -sS -m 10 -w "\nHTTP_CODE:%{http_code}\n" "https://api.gold-api.com/price/XAU" || echo "FAILED gold-api"
      - name: coingecko
        run: |
          curl -sS -m 10 -w "\nHTTP_CODE:%{http_code}\n" "https://api.coingecko.com/api/v3/simple/price?ids=pax-gold&vs_currencies=usd" || echo "FAILED coingecko"
      - name: er-api fx
        run: |
          curl -sS -m 10 -w "\nHTTP_CODE:%{http_code}\n" "https://open.er-api.com/v6/latest/USD" | head -c 400 || echo "FAILED er-api"
      - name: live index.html hash / last-modified
        run: |
          curl -sS -D - -o /dev/null "https://mohia0.github.io/Dahab/"
      - name: live sw.js content check
        run: |
          curl -sS "https://mohia0.github.io/Dahab/sw.js" | head -c 600
